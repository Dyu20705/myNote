name: Work package
description: Create one dependency-safe, independently reviewable child issue.
title: "[Mx][Child] "
labels:
  - status/blocked
body:
  - type: markdown
    attributes:
      value: |
        Use this form for one child work package. Apply `status/ready` only after every readiness checkbox is true and all dependencies are complete.

  - type: input
    id: milestone
    attributes:
      label: Milestone
      description: Use exactly one of M0, M1, M2, M3, M4, or M5.
      placeholder: M1 — Reliable Core
    validations:
      required: true

  - type: input
    id: parent
    attributes:
      label: Parent issue
      description: Reference the roadmap or milestone parent.
      placeholder: "#20"
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: State the single observable outcome.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: List only changes required for this independently reviewable PR.
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: State adjacent work that this issue must not implement.
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Reference every prerequisite issue, PR, release gate, or immutable repository contract.
    validations:
      required: true

  - type: textarea
    id: current_behavior
    attributes:
      label: Current behavior
      description: Describe verified behavior. Mark unknown facts as UNKNOWN — REQUIRES VALIDATION.
    validations:
      required: true

  - type: textarea
    id: target_behavior
    attributes:
      label: Target behavior
      description: Describe the post-change contract.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use observable, testable checklist items.
      placeholder: "- [ ] Exact behavior and evidence"
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Verification plan
      description: List exact commands, expected exit codes, fixtures, and benchmark comparisons.
    validations:
      required: true

  - type: textarea
    id: migration
    attributes:
      label: Migration and rollback
      description: Describe database compatibility, export/backup, interruption behavior, data-loss risk, and clean rollback.
    validations:
      required: true

  - type: textarea
    id: security
    attributes:
      label: Security and privacy
      description: Cover untrusted input, logging, content exposure, worker bounds, and trust boundaries.
    validations:
      required: true

  - type: textarea
    id: performance
    attributes:
      label: Performance
      description: Cover latency, memory, indexing, cleanup, and benchmark requirements.
    validations:
      required: true

  - type: dropdown
    id: risk
    attributes:
      label: Risk level
      description: Select the highest applicable risk.
      options:
        - P0 — data loss or security emergency
        - P1 — serious correctness, privacy, migration, or availability risk
        - P2 — bounded behavior or process risk
        - P3 — low-impact documentation or polish risk
    validations:
      required: true

  - type: checkboxes
    id: readiness
    attributes:
      label: Readiness checks
      options:
        - label: All dependencies are complete, merged, or satisfied by immutable repository state.
          required: true
        - label: The issue is one independently reviewable work package with explicit non-goals.
          required: true
        - label: Acceptance criteria and verification commands are testable before applying `status/ready`.
          required: true
        - label: This work does not implement Sync, AI, or public Plugin API before M1–M4 release gates pass.
          required: true
