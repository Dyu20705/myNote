<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>myNote</title>
    <meta name="description" content="Minimal local note app." />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1>myNote</h1>
          <p class="lede">Local notes. Keyboard first. No noise.</p>
        </div>
        <div class="status-line">
          <span id="noteCount">0 notes</span>
          <span id="saveState">Saved locally</span>
          <span id="metricsState" class="metrics-state">render:0.0ms search:0.0ms worker:0.0ms autosave:0.0ms mem:0.0MB</span>
        </div>
      </header>

      <section class="command-bar">
        <label class="search-box" for="searchInput">
          <span>Search</span>
          <input id="searchInput" type="search" autocomplete="off" placeholder="Filter notes" />
        </label>
        <button id="newNoteButton" class="primary-button" type="button">New note</button>
      </section>

      <section class="workspace">
        <aside class="panel notes-panel">
          <div class="panel-header">
            <h2>Notes</h2>
            <span id="activeNoteLabel">Ready</span>
          </div>
          <div id="noteList" class="note-list" aria-live="polite"></div>
        </aside>

        <section class="panel editor-panel">
          <div class="panel-header">
            <h2>Editor</h2>
            <span>Markdown native</span>
          </div>
          <input id="titleInput" class="title-input" type="text" placeholder="Title" spellcheck="false" />
          <textarea id="contentInput" class="content-input" placeholder="Write here."></textarea>
          <section class="backlinks-panel" aria-live="polite">
            <h3>Backlinks</h3>
            <div id="backlinksList" class="backlinks-list"></div>
          </section>
          <div class="editor-footer">
            <span class="hint">Ctrl/⌘+K command palette</span>
            <button id="saveButton" class="primary-button" type="button">Save</button>
          </div>
        </section>
      </section>

      <section id="commandPalette" class="command-palette" hidden>
        <div class="command-panel" role="dialog" aria-modal="true" aria-label="Command palette">
          <input id="commandInput" class="command-input" type="text" placeholder="Type a command" autocomplete="off" />
          <div id="commandList" class="command-list"></div>
        </div>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
